name: Destroy Workflow

on:
#  push:
#    branches:
#      - main
  workflow_dispatch:

env:
  # These secrets are set in github.com > Settings > Secrets & Variables > Actions.
  # Create your secrets there, then they're loaded in here and used below in the steps section.    
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
  AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}

# permissions:
#   id-token: write   # This is required for requesting the JWT
#   contents: read    # This is required for actions/checkout

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      # Checkout code to the runner (ubuntu-latest) so that we can run Terraform commands on it.
      # Checkout action: https://github.com/marketplace/actions/checkout
      - name: Checkout Repository
        uses: actions/checkout@v6

      # AWS credentials action: https://github.com/marketplace/actions/configure-aws-credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          #role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Empty S3 Bucket
        run: |
          aws s3 rm --recursive s3://${{ env.AWS_BUCKET_NAME }}

      - name: Install Terraform
      # Terraform setup action: https://github.com/hashicorp/setup-terraform
        uses: hashicorp/setup-terraform@v4
  
      - name: Terraform Initialization
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -destroy -var="bucket_name=${{ env.AWS_BUCKET_NAME }}"
        working-directory: terraform

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var="bucket_name=${{ env.AWS_BUCKET_NAME }}"
        working-directory: terraform
